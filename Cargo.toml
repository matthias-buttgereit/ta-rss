[package]
name = "ta-rss"
version = "0.1.0"
authors = ["Matthias Buttgereit <matthias.buttgereit@outlook.com>"]
license = "MIT"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "=1.0.93"
atom_syndication = "=0.12.4"
chrono = "=0.4.38"
clap = { version = "=4.5.21", features = ["derive"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures = "=0.3.31"
fxhash = "=0.2.1"
html2text = "=0.13.4"
image = "=0.25.5"
open = "=5.3.1"
ratatui = { version = "=0.29.0", features = ["unstable-rendered-line-info"] }
ratatui-image = { git = "https://github.com/benjajaja/ratatui-image", features = [
    "crossterm",
] }
reqwest = "=0.12.9"
rss = { version = "=2.0.11", features = ["atom", "atom_syndication"] }
scraper = "=0.21.0"
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
tokio = { version = "=1.41.1", features = ["full"] }

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
panic = "abort"   # Don't unwind the stack when panicking.
codegen-units = 1 # No parallel codegen units.
lto = true        # Optimize at link time.
