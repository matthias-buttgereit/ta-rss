[package]
name = "ta-rss"
version = "0.1.0"
authors = ["Matthias Buttgereit <matthias.buttgereit@outlook.com>"]
license = "MIT"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "=1.0.96"
atom_syndication = "=0.12.7"
chrono = "=0.4.39"
clap = { version = "=4.5.30", features = ["derive"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures = "=0.3.31"
fxhash = "=0.2.1"
html2text = "=0.14.0"
image = "=0.25.5"
open = "=5.3.2"
ratatui = { version = "=0.29.0", features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
ratatui-image = { git = "https://github.com/benjajaja/ratatui-image", features = [
    "crossterm",
] }
reqwest = "=0.12.12"
rss = { version = "=2.0.12", features = ["atom", "atom_syndication"] }
scraper = "=0.22.0"
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
tokio = { version = "=1.43.0", features = ["full"] }

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
panic = "abort"   # Don't unwind the stack when panicking.
codegen-units = 1 # No parallel codegen units.
lto = true        # Optimize at link time.
